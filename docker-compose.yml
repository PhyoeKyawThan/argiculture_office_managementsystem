version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-document-app
    container_name: aoms
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    volumes:
      - .:/var/www
    depends_on:      # <-- FIX 1: Explicitly tell the app to wait for DB to start (and stop after DB)
      - db
      - redis
    networks:
      - laravel-network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-queue
    restart: unless-stopped
    command: php /var/www/artisan queue:work --timeout=120 --tries=3
    volumes:
      - .:/var/www
    depends_on:
      - app
      - redis
      - db           # <-- FIX 2: Ensure queue stops before DB drops
    networks:
      - laravel-network

  # Nginx Web Server
 # Nginx Web Server
  webserver:
    image: ghcr.io/phyoekyawthan/nginx:latest
    container_name: nginx
    restart: unless-stopped
    user: 0:0
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/laravel.conf:/etc/nginx/conf.d/default.conf # <-- FIX THIS LINE
    depends_on:
      - app
    networks:
      - laravel-network

  # Database
  db:
    image: ghcr.io/phyoekyawthan/mysql:latest
    container_name: mysql
    restart: unless-stopped
    stop_grace_period: 2m # <-- FIX 3: Gives MySQL up to 2 minutes to flush data cleanly before a force-kill
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel-network

  # Redis Cache & Queue Driver
  redis:
    image: ghcr.io/phyoekyawthan/redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  dbdata:
    driver: local